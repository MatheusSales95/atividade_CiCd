# Pipeline de Integracao Continua da API Biblioteca.
#
# A ordem das etapas segue o roteiro da atividade anterior: as verificacoes sao
# ordenadas por custo crescente, de modo que a mais barata capaz de reprovar o
# codigo seja sempre a primeira a rodar.
name: CI

# ═══════════════════════════ GATILHO: PULL REQUEST ═══════════════════════════
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Um commit novo no mesmo PR torna a execucao anterior obsoleta: cancele-a.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Menor privilegio: o GITHUB_TOKEN nasce somente-leitura.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  IMAGE_NAME: api-biblioteca

jobs:
  # ════════════ ETAPA 1 · ANALISE ESTATICA E DE FORMATACAO ════════════
  analise-estatica:
    name: 1 · Analise estatica e formatacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o codigo do PR
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Analise de formatacao (Prettier)
        run: npm run format:check

      - name: Analise estatica de codigo (ESLint)
        run: npm run lint

      - name: Analise estatica de tipos (tsc --noEmit)
        run: npm run typecheck

  # ════════════ ETAPA 2 · ANALISE ESTATICA DE SEGURANCA ════════════
  # Roda em paralelo com a Etapa 1: ambas precisam apenas do codigo-fonte, e
  # serializar o CodeQL (minutos) atras do lint (segundos) so atrasaria o retorno.
  seguranca:
    name: 2 · Analise estatica de seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # necessario para publicar o resultado do CodeQL
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: SAST de codigo (eslint-plugin-security)
        run: npm run security:sast

      - name: Vulnerabilidades em dependencias (npm audit)
        run: npm run security:audit

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analise semantica (CodeQL)
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  # ════════════════════════ ETAPA 3 · BUILD ════════════════════════
  build:
    name: 3 · Build
    needs: analise-estatica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Compilar a aplicacao
        run: npm run build

      - name: Guardar o artefato de build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ════════════════════ ETAPA 4a · TESTE UNITARIO ════════════════════
  testes-unitarios:
    name: 4a · Testes unitarios
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Recuperar o artefato da Etapa 3
        uses: actions/download-artifact@v8
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Executar testes unitarios
        run: npm run test:unit -- --coverage

      - name: Guardar o relatorio de cobertura
        if: always() # o relatorio interessa justamente quando o teste falha
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-unitarios
          path: coverage/
          retention-days: 7

  # ══════════════════ ETAPA 4b · TESTE DE INTEGRACAO ══════════════════
  testes-integracao:
    name: 4b · Testes de integracao
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Banco real, efemero e exclusivo desta execucao.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca
          POSTGRES_DB: biblioteca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biblioteca:biblioteca@localhost:5432/biblioteca

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Recuperar o artefato da Etapa 3
        uses: actions/download-artifact@v8
        with:
          name: build-${{ github.sha }}
          path: dist/

      - name: Aplicar migracoes
        run: npm run db:migrate # valida tambem o script de migracao

      - name: Executar testes de integracao
        run: npm run test:integration

  # ════════════════════ ETAPA 5 · CRIACAO DE IMAGEM ════════════════════
  imagem:
    name: 5 · Criacao de imagem
    needs: [testes-unitarios, testes-integracao, seguranca]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derivar tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=long

      - name: Construir a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # No PR a imagem e validada, nao publicada: construir ja prova que o
          # Dockerfile funciona, e nao publicar dispensa credencial de escrita.
          push: false
          load: true # carrega no daemon local para o smoke test
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — a imagem sobe e responde?
        run: |
          IMAGEM=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "Testando a imagem: $IMAGEM"

          # /health nao toca o banco, mas DATABASE_URL e obrigatoria na subida.
          docker run --rm -d --name smoke -p 8080:8080 \
            -e DATABASE_URL=postgresql://nao-usado@localhost:5432/nao-usado \
            "$IMAGEM"

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then OK=1; break; fi
            sleep 2
          done

          echo
          echo "─── logs do contêiner ───"
          docker logs smoke
          docker stop smoke

          if [ "${OK:-0}" != "1" ]; then
            echo "::error::A imagem subiu, mas /health nao respondeu."
            exit 1
          fi
          echo "Smoke test aprovado."

      - name: Inspecionar a imagem gerada
        run: |
          IMAGEM=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker image inspect "$IMAGEM" \
            --format 'Imagem: {{.RepoTags}}{{"\n"}}Tamanho: {{.Size}} bytes{{"\n"}}Usuario: {{.Config.User}}'

  # ═══════════ GATE · CHECK UNICO PARA O BRANCH PROTECTION ═══════════
  ci:
    name: CI
    if: always() # roda mesmo quando uma etapa anterior falha
    needs:
      [analise-estatica, seguranca, build, testes-unitarios, testes-integracao, imagem]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar o resultado das etapas
        run: |
          RESULTADOS="${{ join(needs.*.result, ' ') }}"
          echo "Resultados: $RESULTADOS"
          for R in $RESULTADOS; do
            if [ "$R" != "success" ]; then
              echo "::error::Etapa com resultado '$R' — CI reprovada."
              exit 1
            fi
          done
          echo "Todas as etapas concluiram com sucesso."
